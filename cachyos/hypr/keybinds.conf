# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

#!
##! Window
# Focusing


################################################################################
# Hyprland AeroSpace-like Setup
################################################################################

# ========== General ==========
# monitor=,preferred,auto,1
# exec-once = hyprpaper & hypridle & waybar

# hyprctl monitors
# LG（DP-1）を左、BenQ（HDMI-A-1）を右
monitor=DP-1,2560x1440@180,0x0,1
monitor=HDMI-A-1,1920x1080@60,2560x0,1
# BenQ（HDMI-A-1）を左、LG（DP-1）を右
# monitor=HDMI-A-1,1920x1080@60,0x0,1
# monitor=DP-1,2560x1440@180,1920x0,1
# 縦配置にしたい（上＝LG、下＝BenQ）
# monitor=LG ULTRAGEAR (DP-1),2560x1440@180,0x0,1
# monitor=BenQ EW2780 (HDMI-A-1),1920x1080@60,640x1440,1

################################################################################
# ========== Workspaces ==========
################################################################################

workspace = 1, name:terminal, monitor:DP-1
workspace = 2, name:browser, monitor:HDMI-A-1
workspace = 3, name:chat, monitor:DP-1
workspace = 4, name:note, monitor:DP-1
workspace = 5, name:others, monitor:DP-1

################################################################################
# ========== Window Rules ==========
################################################################################

# Terminal
windowrulev2 = workspace 1, class:^(kitty)$
# Browser
windowrulev2 = workspace 2, class:^(firefox|Chromium|Brave-browser|Google-chrome|Vivaldi)$
# Chat apps
windowrulev2 = workspace 3, class:^(Slack|discord)$
# Note apps
windowrulev2 = workspace 4, class:^(obsidian|ChatGPT|notion)$
# Others
windowrulev2 = workspace 5, class:^(Spotify|Anki|TickTick)$

# Floating windows (システム系)
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|Blueman-manager|thunar|Nautilus|org.gnome.Nautilus)$

################################################################################
# ========== Keybindings ==========
################################################################################

# 基本操作
bind = ALT, RETURN, exec, kitty
bind = ALT, Q, killactive
bind = ALT, M, fullscreen
bind = ALT CTRL, T, togglefloating
# bindd = ALT, Space, Toggle overview, global, quickshell:overviewToggle # [hidden] Toggle overview/launcher (alt)
bind = ALT, Space, exec, walker # [hidden] Toggle overview/launcher (alt)
bind = ALT, S, exec, flameshot gui

binde = ALT CTRL SHIFT, H, splitratio, -0.1 # 横幅-
binde = ALT CTRL SHIFT, L, splitratio, +0.1 # 横幅+

# Ctrl×2 → (keydが) 送る想定
bind = ALT, Y, exec, hdrop kitty --class dropdown_kitty
windowrulev2 = float,class:^(dropdown_kitty)$
# windowrulev2 = maximize,class:^(dropdown_kitty)$
windowrulev2 = fullscreen,class:^(dropdown_kitty)$
# windowrulev2 = size 80% 80%,class:^(dropdown_kitty)$

################################################################################
# ========== Layout Switching ==========
################################################################################

# アコーディオン（タブ風）に切り替え（グループ化）
bind = ALT CTRL, A, togglegroup, active
# 隣り合わせのグループに追加
bind = ALT CTRL SHIFT, H, exec, hyprctl dispatch moveintogroup l
bind = ALT CTRL SHIFT, L, exec, hyprctl dispatch moveintogroup r
bind = ALT CTRL SHIFT, K, exec, hyprctl dispatch moveintogroup u
bind = ALT CTRL SHIFT, J, exec, hyprctl dispatch moveintogroup d

# グループ内でタブ切り替え
bind = ALT CTRL, l, changegroupactive, f
bind = ALT CTRL, h, changegroupactive, b

################################################################################
# ========== Focus / Move ==========
################################################################################

# フォーカス移動（AeroSpace風）
bind = ALT, H, movefocus, l
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r

# ウィンドウ移動
bind = ALT SHIFT, H, movewindow, l
bind = ALT SHIFT, J, movewindow, d
bind = ALT SHIFT, K, movewindow, u
bind = ALT SHIFT, L, movewindow, r
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, T, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, B, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, C, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, N, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, O, movetoworkspace, 5

# ========== ワークスペース移動 ==========
bind = ALT, 1, workspace, 1
bind = ALT, T, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, B, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, C, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, N, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, O, workspace, 5
bind = CTRL SHIFT, h, workspace, r-1
bind = CTRL SHIFT, l, workspace, r+1

# 前のワークスペースに戻る
bind = ALT, TAB, workspace, previous

################################################################################
# ========== Optional Startup Apps ==========
################################################################################

exec-once = vivaldi &
exec-once = kitty &
# exec-once = slack &
# exec-once = obsidian &
# exec-once = spotify &
